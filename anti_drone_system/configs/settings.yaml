camera:
  buffer_size: 1
  source: '0'
  type: usb

guidance:
  closing_speed: 3.0
  deadzone_x: 25.0
  deadzone_y: 20.0
  desired_follow_distance: 5.0
  los_rate_smoothing: 0.3
  max_climb_rate: 3.0
  max_forward_speed: 5.0
  max_speed_xy: 5.0
  max_speed_z: 3.0
  max_yaw_rate: 0.8
  min_distance_intercept: 1.5
  nav_constant: 4.0
  reacquisition_timeout: 5.0
  rtl_after_timeout: false
  target_lock_tolerance: 0.08
  target_loss_timeout: 3.0

mavlink:
  connection_type: udp
  udp_address: 127.0.0.1
  udp_port: 14550
system:
  simulation_mode: true

ranging:
  drone_real_size: 0.35
  filter_alpha: 0.25
  focal_length: 800.0

system:
  debug_overlay: true
  gui: false
  low_confidence_warning: 0.40
  min_fps_warning: 15.0
  mode: webcam
  output_dir: outputs
  save_output: false
  simulation_mode: false

tracker:
  lk_max_fallback_frames: 15
  match_threshold: 0.8
  min_box_area: 50
  track_buffer: 30
  track_threshold: 0.45

yolo:
  # PRIMARY model (models/best.pt) — custom trained drone model.
  # class 0 = drone in this model. target_class_ids: [0] is CORRECT here.
  #
  # FALLBACK model (yolov8n.pt) — COCO pretrained, 80 classes.
  # class 0 = person in COCO. When falling back, the detector automatically
  # switches class filter to null and applies shape/aspect filters instead.
  #
  confidence_threshold: 0.30
  device: cuda
  imgsz: 640

  # Shape filters — applied to ALL detections regardless of model
  max_box_ratio: 0.50        # reject if box > 50% of frame area
  max_box_width_ratio: 0.80  # reject overly wide boxes
  max_box_height_ratio: 0.75 # reject overly tall boxes

  # Aspect ratio — only applied when using the FALLBACK COCO model
  # Drone: w/h ~ 0.6-2.0  |  Person: w/h ~ 0.25-0.5 (tall & thin)
  fallback_min_aspect_ratio: 0.55
  fallback_max_aspect_ratio: 2.50
  # COCO class IDs to BLOCK in fallback mode (person=0, bird=14, cat=15, dog=16)
  fallback_blocked_class_ids:
  - 0
  - 14
  - 15
  - 16

  max_detections: 1
  model_path: models/best.pt
  nms_threshold: 0.45

  # Class 0 = drone in your custom trained model — DO NOT CHANGE
  target_class_ids:
  - 0

  train_settings:
    batch_size: 16
    cache: false
    epochs: 50
    workers: 2
